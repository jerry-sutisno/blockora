<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff4ff"/>
    </linearGradient>

    <!-- Balok Biru (Primary) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Balok Coral (Secondary) -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Balok Emerald (Tertiary) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bayangan Taktil -->
    <filter id="shadowDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1c30" flood-opacity="0.14"/>
    </filter>
    <filter id="tileDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b1c30" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Container Bingkai Kartu Luar -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#dbe1ff" stroke-width="4" filter="url(#shadowDrop)"/>

  <!-- Komposisi Balok Taktil BLOCKORA (Grid 2x2 L-Shape Taktil) -->
  <g filter="url(#tileDrop)">
    <!-- Balok 1: Biru Azure (Kiri Atas) -->
    <g transform="translate(136, 136)">
      <rect x="0" y="4" width="112" height="112" rx="24" fill="#1e3a8a" opacity="0.3"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="url(#blueGrad)"/>
      <rect x="6" y="6" width="100" height="28" rx="14" fill="#ffffff" opacity="0.38"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Balok 2: Coral Rose (Kanan Atas) -->
    <g transform="translate(264, 136)">
      <rect x="0" y="4" width="112" height="112" rx="24" fill="#881337" opacity="0.3"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="url(#coralGrad)"/>
      <rect x="6" y="6" width="100" height="28" rx="14" fill="#ffffff" opacity="0.38"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Balok 3: Emerald Hijau (Kiri Bawah) -->
    <g transform="translate(136, 264)">
      <rect x="0" y="4" width="112" height="112" rx="24" fill="#064e3b" opacity="0.3"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="url(#emeraldGrad)"/>
      <rect x="6" y="6" width="100" height="28" rx="14" fill="#ffffff" opacity="0.38"/>
      <rect x="0" y="0" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Balok Aksen Mini (Kanan Bawah Dot Poin) -->
    <g transform="translate(264, 264)">
      <rect x="0" y="0" width="112" height="112" rx="24" fill="#eff4ff" stroke="#d3e4fe" stroke-width="3"/>
      <circle cx="56" cy="56" r="22" fill="#2563eb" opacity="0.9"/>
      <circle cx="56" cy="56" r="10" fill="#ffffff"/>
    </g>
  </g>
</svg>
